apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: amrutam
resources:
  - ../../base
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: amrutam-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/amrutam/telemedicine-backend:0.1.0
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: amrutam-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/amrutam/telemedicine-backend:0.1.0
