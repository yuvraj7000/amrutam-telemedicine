apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: amrutam-staging
resources:
  - ../../base
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: amrutam-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/amrutam/telemedicine-backend:staging
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: amrutam-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/amrutam/telemedicine-backend:staging
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: amrutam-api
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.staging.amrutam.example
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.amrutam.example
      - op: replace
        path: /spec/tls/0/secretName
        value: amrutam-api-staging-tls
