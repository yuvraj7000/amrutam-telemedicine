apiVersion: v1
kind: ConfigMap
metadata:
  name: amrutam-config
  labels:
    app.kubernetes.io/name: amrutam
data:
  NODE_ENV: production
  PORT: '3000'
  LOG_LEVEL: info
  CORS_ORIGINS: https://app.amrutam.example
  TRUST_PROXY: '1'
  DB_POOL_MAX: '15'
  DB_STATEMENT_TIMEOUT_MS: '5000'
  DB_IDLE_IN_TX_TIMEOUT_MS: '10000'
  JWT_ACCESS_TTL_SEC: '900'
  REFRESH_TTL_DAYS: '14'
  MFA_TOKEN_TTL_SEC: '300'
  MFA_ISSUER: Amrutam
  LOGIN_MAX_FAILURES: '5'
  LOGIN_LOCK_MINUTES: '15'
  RL_GLOBAL_PER_MIN: '120'
  RL_AUTH_PER_MIN: '10'
  RL_BOOKING_PER_MIN: '20'
  SLOT_HOLD_MINUTES: '10'
  MIN_BOOKING_LEAD_MINUTES: '15'
  CANCEL_FULL_REFUND_HOURS: '24'
  IDEMPOTENCY_TTL_HOURS: '24'
  PAYMENT_PROVIDER: razorpay
  PAYMENT_TIMEOUT_MS: '3000'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4318
  OTEL_SERVICE_NAME: amrutam-api
