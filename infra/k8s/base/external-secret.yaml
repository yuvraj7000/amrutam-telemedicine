apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: amrutam-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: amrutam-runtime
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: amrutam/runtime
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: amrutam/runtime
        property: REDIS_URL
    - secretKey: JWT_KEYS
      remoteRef:
        key: amrutam/runtime
        property: JWT_KEYS
    - secretKey: JWT_ACTIVE_KID
      remoteRef:
        key: amrutam/runtime
        property: JWT_ACTIVE_KID
    - secretKey: ENC_KEYS
      remoteRef:
        key: amrutam/runtime
        property: ENC_KEYS
    - secretKey: ENC_ACTIVE_VERSION
      remoteRef:
        key: amrutam/runtime
        property: ENC_ACTIVE_VERSION
    - secretKey: KMS_KEY_ID
      remoteRef:
        key: amrutam/runtime
        property: KMS_KEY_ID
    - secretKey: PAYMENT_WEBHOOK_SECRET
      remoteRef:
        key: amrutam/runtime
        property: PAYMENT_WEBHOOK_SECRET
    - secretKey: PAYMENT_API_KEY
      remoteRef:
        key: amrutam/runtime
        property: PAYMENT_API_KEY
    - secretKey: METRICS_TOKEN
      remoteRef:
        key: amrutam/runtime
        property: METRICS_TOKEN
