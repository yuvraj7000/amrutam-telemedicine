apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: amrutam-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: amrutam-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: amrutam-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: amrutam-worker
