{
  "openapi": "3.1.0",
  "info": {
    "title": "Amrutam API",
    "version": "1.0.0",
    "description": "Versioned REST API for the Amrutam telemedicine platform."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "components": {
    "schemas": {
      "EnableMfaRequest": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^\\d{6}$"
          }
        },
        "required": [
          "code"
        ],
        "additionalProperties": false
      },
      "VerifyMfaRequest": {
        "type": "object",
        "properties": {
          "mfaToken": {
            "type": "string",
            "minLength": 1
          },
          "code": {
            "type": "string",
            "pattern": "^\\d{6}$"
          },
          "backupCode": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64
          }
        },
        "required": [
          "mfaToken"
        ],
        "additionalProperties": false
      },
      "DisableMfaRequest": {
        "type": "object",
        "properties": {
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256
          },
          "code": {
            "type": "string",
            "pattern": "^\\d{6}$"
          }
        },
        "required": [
          "password",
          "code"
        ],
        "additionalProperties": false
      },
      "RegisterRequest": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string",
            "maxLength": 320,
            "format": "email"
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 256
          },
          "fullName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "phone": {
            "type": "string",
            "maxLength": 30
          },
          "role": {
            "type": "string",
            "enum": [
              "PATIENT",
              "DOCTOR"
            ],
            "default": "PATIENT"
          },
          "doctor": {
            "type": "object",
            "properties": {
              "licenseNumber": {
                "type": "string",
                "minLength": 1,
                "maxLength": 100
              },
              "specializations": {
                "type": "array",
                "items": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 80
                },
                "minItems": 1,
                "maxItems": 20
              },
              "languages": {
                "type": "array",
                "items": {
                  "type": "string",
                  "minLength": 2,
                  "maxLength": 10
                },
                "minItems": 1,
                "maxItems": 10
              },
              "consultationFeeMinor": {
                "type": "integer",
                "minimum": 0
              },
              "yearsExperience": {
                "type": "integer",
                "minimum": 0,
                "maximum": 70
              },
              "bio": {
                "type": "string",
                "maxLength": 5000
              }
            },
            "required": [
              "licenseNumber",
              "specializations",
              "languages",
              "consultationFeeMinor",
              "yearsExperience"
            ],
            "additionalProperties": false
          }
        },
        "required": [
          "email",
          "password",
          "fullName"
        ],
        "additionalProperties": false
      },
      "LoginRequest": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string",
            "maxLength": 256
          }
        },
        "required": [
          "email",
          "password"
        ],
        "additionalProperties": false
      },
      "RefreshTokenRequest": {
        "type": "object",
