      "CreateAvailabilitySlotsRequest": {
        "anyOf": [
          {
            "type": "object",
            "properties": {
              "slots": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "start": {
                      "type": "string",
                      "format": "date-time"
                    },
                    "end": {
                      "type": "string",
                      "format": "date-time"
                    }
                  },
                  "required": [
                    "start",
                    "end"
                  ],
                  "additionalProperties": false
                },
                "minItems": 1,
                "maxItems": 200
              }
            },
            "required": [
              "slots"
            ],
            "additionalProperties": false
          },
          {
            "type": "object",
            "properties": {
              "recurrence": {
                "type": "object",
                "properties": {
                  "from": {
                    "type": "string",
                    "format": "date"
                  },
                  "to": {
                    "type": "string",
                    "format": "date"
                  },
                  "daysOfWeek": {
                    "type": "array",
                    "items": {
                      "type": "integer",
                      "minimum": 0,
                      "maximum": 6
                    },
                    "minItems": 1,
                    "maxItems": 7
                  },
                  "dailyWindows": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "start": {
                          "type": "string",
                          "pattern": "^\\d{2}:\\d{2}$"
                        },
                        "end": {
                          "type": "string",
                          "pattern": "^\\d{2}:\\d{2}$"
                        }
                      },
                      "required": [
                        "start",
                        "end"
                      ],
                      "additionalProperties": false
                    },
                    "minItems": 1,
                    "maxItems": 8
                  },
                  "slotMinutes": {
                    "type": "integer",
                    "minimum": 5,
                    "maximum": 240
                  },
                  "timezone": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 100
                  }
                },
                "required": [
                  "from",
                  "to",
                  "daysOfWeek",
                  "dailyWindows",
                  "slotMinutes",
                  "timezone"
                ],
                "additionalProperties": false
              }
            },
            "required": [
              "recurrence"
            ],
            "additionalProperties": false
          }
        ]
      },
      "DoctorSlotsQuery": {
