            "maxLength": 80
          }
        },
        "required": [
          "fullName"
        ],
        "additionalProperties": false
      },
      "DoctorSearchQuery": {
        "type": "object",
        "properties": {
          "q": {
            "type": "string",
            "maxLength": 100
          },
          "specialization": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 80
              },
              {
                "type": "array",
                "items": {
                  "type": "string",
                  "maxLength": 80
                }
              }
            ]
          },
          "language": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 30
              },
              {
                "type": "array",
                "items": {
                  "type": "string",
                  "maxLength": 30
                }
              }
            ]
          },
          "mode": {
            "type": "string",
            "enum": [
              "VIDEO",
              "AUDIO",
              "CHAT"
            ]
          },
          "minFee": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0
          },
          "maxFee": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0
          },
          "minRating": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0,
            "maximum": 5
          },
          "availableFrom": {
            "type": "string",
            "format": "date-time"
          },
          "availableTo": {
            "type": "string",
            "format": "date-time"
          },
          "sort": {
            "type": "string",
            "enum": [
              "rating",
              "fee_asc",
              "fee_desc",
              "experience",
              "next_available"
            ],
            "default": "rating"
          },
          "limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100,
            "default": 20
          },
          "cursor": {
            "type": "string"
          },
          "includeUnverified": {
            "anyOf": [
              {
                "type": "boolean"
              },
              {
                "type": "string",
                "enum": [
                  "true",
                  "false"
                ]
              }
            ],
            "default": false
          }
        },
        "additionalProperties": false
      },
      "UpdateDoctorProfileRequest": {
        "type": "object",
        "properties": {
          "specializations": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 80
            },
            "maxItems": 20
          },
          "languages": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 80
            },
            "maxItems": 20
          },
          "bio": {
            "type": "string",
            "maxLength": 5000
          },
          "yearsExperience": {
            "type": "integer",
            "minimum": 0,
            "maximum": 70
          },
          "consultationFeeMinor": {
            "type": "integer",
            "minimum": 0,
            "maximum": 10000000
          },
          "modes": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "VIDEO",
                "AUDIO",
                "CHAT"
              ]
            },
            "minItems": 1,
            "maxItems": 3
          },
          "isAccepting": {
            "type": "boolean"
          }
        },
        "required": [
          "specializations",
          "languages",
          "yearsExperience",
          "consultationFeeMinor",
          "modes",
          "isAccepting"
        ],
        "additionalProperties": false
      },
      "DoctorIdPath": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "id"
        ],
        "additionalProperties": false
      },
      "VerificationDoctorIdPath": {
